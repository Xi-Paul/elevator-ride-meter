name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source zip
        run: |
          if [ -f android-src.zip ]; then unzip -o android-src.zip -d .; fi
          echo "--- tree ---"
          find . -name '*.kts' -o -name '*.kt' -o -name 'AndroidManifest.xml' | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: |
          VER="${GITHUB_REF_NAME}"
          case "$VER" in v*) ;; *) VER="dev-${GITHUB_SHA::7}" ;; esac
          CODE=$(( $(date -u +%s) / 60 ))
          echo "versionName=$VER versionCode=$CODE"
          gradle assembleRelease --no-daemon --stacktrace -PverName="$VER" -PverCode="$CODE"

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/ride-meter.apk
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ride-meter-apk
          path: out/ride-meter.apk
          if-no-files-found: error

      # 태그(v1.0 등)를 붙여 push 하면 공개 다운로드 링크가 있는 Release 가 만들어진다
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/ride-meter.apk
          generate_release_notes: true
