name: Migrate to monorepo

# 통합 작업용 1회성 워크플로.
# 주의: Actions 기본 토큰은 .github/workflows/ 아래 파일을 만들거나 고칠 수 없다.
#       그래서 pages.yml 과 android.yml 은 사람이 직접 만들고, 이 워크플로는 .github/ 를 건드리지 않는다.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if already migrated
        id: guard
        run: |
          if [ -d web ] && [ -d android ] && [ ! -f repo-payload.zip ]; then
            echo "이미 통합된 상태입니다. 할 일이 없습니다."
            echo "skip=yes" >> "$GITHUB_OUTPUT"
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Show current layout
        if: steps.guard.outputs.skip == 'no'
        run: |
          echo "--- 통합 전 ---"
          find . -path ./.git -prune -o -type f -print | sort

      - name: Unpack new structure
        if: steps.guard.outputs.skip == 'no'
        run: |
          set -x
          if [ ! -f repo-payload.zip ]; then
            echo "::error::루트에 repo-payload.zip 이 없습니다."
            ls -la
            exit 1
          fi
          unzip -o repo-payload.zip -d .
          rm -f repo-payload.zip

      - name: Remove old layout
        if: steps.guard.outputs.skip == 'no'
        run: |
          set -x
          # 루트에 있던 웹 파일 (이제 web/ 아래로 이동)
          rm -f index.html sw.js version.json manifest.json icon.svg
          # 압축 상태로 두던 안드로이드 소스 (이제 android/ 로 풀려 있음)
          rm -f android-src.zip
          # .github/ 없이 루트에 잘못 올라가 동작하지 않던 워크플로 파일·폴더
          rm -f build.yml pages.yml android.yml
          rm -rf workflows
          # .github/ 는 건드리지 않는다 (토큰 권한 밖)
          echo "--- 통합 후 ---"
          find . -path ./.git -prune -o -type f -print | sort
          echo "파일 수: $(find . -path ./.git -prune -o -type f -print | wc -l)"

      - name: Commit and push
        if: steps.guard.outputs.skip == 'no'
        run: |
          set -x
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "웹·안드로이드 저장소 통합 (web/, android/)"
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main
          echo "완료. 이제 .github/workflows/migrate.yml 을 직접 삭제하세요."
