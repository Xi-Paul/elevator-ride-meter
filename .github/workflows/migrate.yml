name: Migrate to monorepo

# 통합 작업용 1회성 워크플로.
# repo-payload.zip 을 풀어 새 구조를 만들고, 옛 파일과 자기 자신을 지운 뒤 커밋한다.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show current layout
        run: |
          echo "--- 통합 전 ---"
          ls -la
          find . -path ./.git -prune -o -type f -print | sort

      - name: Unpack new structure
        run: |
          set -x
          if [ ! -f repo-payload.zip ]; then
            echo "::error::루트에 repo-payload.zip 이 없습니다. 아래 목록을 확인하세요."
            ls -la
            exit 1
          fi
          unzip -o repo-payload.zip -d .
          rm -f repo-payload.zip
          echo "--- 압축 해제 직후 ---"
          ls -la
          ls -la web android .github/workflows || true

      - name: Remove old layout
        run: |
          set -x
          # 루트에 있던 웹 파일 (이제 web/ 아래로 이동)
          rm -f index.html sw.js version.json manifest.json icon.svg
          # 압축 상태로 두던 안드로이드 소스 (이제 android/ 로 풀려 있음)
          rm -f android-src.zip
          # .github/ 없이 루트에 잘못 올라가 동작하지 않던 워크플로 파일·폴더
          rm -f build.yml pages.yml android.yml
          rm -rf workflows
          # 예전 워크플로
          rm -f .github/workflows/build.yml .github/workflows/stamp.yml
          # 1회성 워크플로 자신도 제거 → 다시 실행되지 않는다
          rm -f .github/workflows/migrate.yml
          echo "--- 통합 후 ---"
          find . -path ./.git -prune -o -type f -print | sort
          echo "파일 수: $(find . -path ./.git -prune -o -type f -print | wc -l)"

      - name: Commit and push
        run: |
          set -x
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "변경 없음 — 이미 통합된 상태입니다."
            exit 0
          fi
          git commit -m "웹·안드로이드 저장소 통합 (web/, android/, 워크플로 분리)"
          # 기본 토큰이 읽기 전용으로 설정된 저장소에서도 동작하도록 원격을 명시한다
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:main
