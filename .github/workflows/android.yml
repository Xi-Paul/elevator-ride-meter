name: Build Android APK

# paths 필터를 태그 트리거와 함께 쓰면, 태그 푸시에는 변경 파일 목록이 잡히지 않아
# 조건을 통과하지 못한다(태그는 기존 커밋을 가리킬 뿐이라 diff 가 없다). 그래서 paths 를 쓰지 않는다.
on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'V*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check source
        run: |
          test -f android/settings.gradle.kts || { echo "::error::android/ 소스가 없습니다"; ls -la; exit 1; }
          find android -name '*.kt' | wc -l

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: |
          VER="${GITHUB_REF_NAME}"
          # 태그 이름은 대소문자를 구분하므로 v / V 를 모두 받는다
          case "$VER" in v*|V*) ;; *) VER="dev-${GITHUB_SHA::7}" ;; esac
          CODE=$(( $(date -u +%s) / 60 ))
          echo "versionName=$VER versionCode=$CODE"
          gradle assembleRelease --no-daemon --stacktrace -PverName="$VER" -PverCode="$CODE"

      - name: Collect APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/ride-meter.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ride-meter-apk
          path: out/ride-meter.apk
          if-no-files-found: error

      # v로 시작하는 태그를 붙여 push 하면 로그인 없이 받을 수 있는 Release 가 만들어진다
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/V')
        uses: softprops/action-gh-release@v2
        with:
          files: out/ride-meter.apk
          generate_release_notes: true
