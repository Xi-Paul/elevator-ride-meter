<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151b25">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<title>승강기 주행 계측</title>
<style>
  :root{
    --bg:#151b25; --panel:#1d2532; --line:#2b3648; --ink:#e8edf5; --dim:#8d9ab0;
    --acc:#f2b33d; --vel:#5cc8ff; --jrk:#ff7d6e; --ok:#63d39a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;-webkit-user-select:none;user-select:none}
  body{padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px);max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh;gap:12px}
  header{display:flex;align-items:baseline;justify-content:space-between;padding-top:12px}
  header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  header span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:10px;padding:4px;gap:4px}
  .tab{border:0;border-radius:7px;padding:10px;font-size:15px;font-weight:600;background:transparent;color:var(--dim);font-family:inherit;display:flex;justify-content:center;gap:8px;align-items:center}
  .tab.on{background:var(--ink);color:var(--bg)}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .tab .dot.has{background:var(--ok)} .tab .dot.rec{background:var(--jrk)}
  .readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ro{background:var(--panel);border-radius:10px;padding:12px 10px 10px;border-top:3px solid var(--c)}
  .ro .k{font-size:12px;color:var(--dim)}
  .ro .v{font-size:30px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px;color:var(--c)}
  .ro .u{font-size:11px;color:var(--dim)}
  .ro .p{font-size:12px;color:var(--ink);margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.5}
  .ro .p em{font-style:normal;color:var(--dim)}
  canvas{width:100%;height:230px;background:var(--panel);border-radius:10px;display:block}
  .stats{background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-variant-numeric:tabular-nums}
  .stats b{font-weight:500;color:var(--dim)}
  .row{display:flex;gap:8px;align-items:center}
  .row label{font-size:12px;color:var(--dim)}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px}
  .spacer{flex:1}
  .btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:auto}
  button{border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:600;color:var(--bg);background:var(--ink);font-family:inherit}
  button.main{grid-column:1 / -1;background:var(--acc)}
  button.main.stop{background:var(--jrk)}
  button.sub{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:14px;padding:12px}
  button:disabled{opacity:.4}
  button:focus-visible{outline:2px solid var(--vel);outline-offset:2px}
  #msg{font-size:13px;color:var(--dim);min-height:18px;text-align:center}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--jrk)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--dim);padding:0 4px}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
</style>
</head>
<body>
<header>
  <h1>승강기 주행 계측</h1>
  <span id="fs">— Hz</span>
</header>

<div class="tabs">
  <button class="tab on" data-run="up"><span class="dot" id="dot-up"></span>상승</button>
  <button class="tab" data-run="down"><span class="dot" id="dot-down"></span>하강</button>
</div>

<div class="readouts">
  <div class="ro" style="--c:var(--acc)"><div class="k">가속도</div><div class="v" id="a">0.00</div><div class="u">m/s²</div><div class="p"><em>max</em> <span id="amax">0.00</span><br><em>min</em> <span id="amin">0.00</span></div></div>
  <div class="ro" style="--c:var(--vel)"><div class="k">속도</div><div class="v" id="v">0.00</div><div class="u">m/s</div><div class="p"><em>max</em> <span id="vmax">0.00</span><br><em>min</em> <span id="vmin">0.00</span></div></div>
  <div class="ro" style="--c:var(--jrk)"><div class="k">저크</div><div class="v" id="j">0.00</div><div class="u">m/s³</div><div class="p"><em>max</em> <span id="jmax">0.00</span><br><em>min</em> <span id="jmin">0.00</span></div></div>
</div>

<canvas id="cv"></canvas>
<div class="legend"><span><i style="background:var(--acc)"></i>가속도</span><span><i style="background:var(--vel)"></i>속도</span><span><i style="background:var(--jrk)"></i>저크</span></div>

<div class="stats">
  <div><b>주행 시간</b> <span id="dur">0.0 s</span></div>
  <div><b>이동 거리</b> <span id="dist">0.00 m</span></div>
  <div><b>속도 드리프트 보정</b> <span id="bias">—</span></div>
  <div><b>샘플 수</b> <span id="n">0</span></div>
</div>

<div class="row">
  <label for="fc">저역통과 차단주파수</label>
  <select id="fc"><option value="2">2 Hz</option><option value="3" selected>3 Hz</option><option value="5">5 Hz</option><option value="8">8 Hz</option></select>
  <div class="spacer"></div>
  <label for="jfc">저크 필터</label>
  <select id="jfc"><option value="1">1 Hz</option><option value="2" selected>2 Hz</option><option value="4">4 Hz</option></select>
</div>

<div id="msg"></div>

<div class="btns">
  <button class="main" id="go">시작</button>
  <button class="sub" id="csv" disabled>CSV 저장</button>
  <button class="sub" id="load">CSV 불러오기</button>
  <button class="sub" id="reset" disabled>초기화</button>
  <input type="file" id="file" accept=".csv,text/csv" hidden>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const msg = (t, cls='') => { $('msg').textContent = t; $('msg').className = cls; };
  const IDLE_MSG = '휴대폰을 카 바닥이나 손잡이에 고정하고, 정지 상태에서 시작을 누르세요.';
  const LABEL = { up:'상승', down:'하강' };

  // 탭별 독립 데이터
  const newRun = () => ({ S:[], state:'idle', fsEst:0, bias:null, src:null });
  const runs = { up:newRun(), down:newRun() };
  let cur = 'up';          // 표시 중인 탭
  let recRun = null;       // 기록 중인 탭 키 (기록은 시작 당시 탭에 귀속)

  // 기록 중 임시 상태
  let ghat = null, gmag = 9.81, calibBuf = [];
  let t0 = 0, lastT = 0, lastA = 0, v = 0, s = 0;
  const aSt = [0,0], jSt = [0,0];
  let wake = null, raf = 0;

  function lpf(x, dt, fc, st) {
    const rc = 1 / (2 * Math.PI * fc), al = dt / (rc + dt);
    st[0] += al * (x - st[0]);
    st[1] += al * (st[0] - st[1]);
    return st[1];
  }

  function onMotion(e) {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null || !recRun) return;
    const R = runs[recRun];
    const now = performance.now() / 1000;

    if (R.state === 'calib') {
      calibBuf.push([g.x, g.y, g.z, now]);
      if (now - calibBuf[0][3] >= 2.0) {
        const n = calibBuf.length;
        const m = calibBuf.reduce((p,c)=>[p[0]+c[0],p[1]+c[1],p[2]+c[2]],[0,0,0]).map(x=>x/n);
        gmag = Math.hypot(...m); ghat = m.map(x => x / gmag);
        R.fsEst = n / (now - calibBuf[0][3]);
        aSt[0]=aSt[1]=0; jSt[0]=jSt[1]=0;
        t0 = now; lastT = now; lastA = 0; v = 0; s = 0; R.S = [];
        R.state = 'rec';
        refreshUI();
        msg(`[${LABEL[recRun]}] 영점 완료 (|g| = ${gmag.toFixed(3)} m/s²). 기록 중 — 주행이 끝나면 정지를 누르세요.`, 'ok');
        raf = requestAnimationFrame(draw);
      }
      return;
    }
    if (R.state !== 'rec') return;

    const dt = now - lastT; if (dt <= 0 || dt > 0.5) { lastT = now; return; }
    lastT = now;
    const t = now - t0;
    const ar = g.x*ghat[0] + g.y*ghat[1] + g.z*ghat[2] - gmag;
    const a = lpf(ar, dt, +$('fc').value, aSt);
    const j = lpf((a - lastA) / dt, dt, +$('jfc').value, jSt);
    v += (a + lastA) / 2 * dt;
    s += v * dt;
    lastA = a;
    R.S.push({t, ar, a, v, j, s});
  }

  function finish() {
    const key = recRun, R = runs[key];
    window.removeEventListener('devicemotion', onMotion);
    cancelAnimationFrame(raf);
    if (wake) { wake.release(); wake = null; }
    recRun = null;
    if (R.S.length < 10) { R.state = 'idle'; R.S = []; refreshUI(); msg('데이터가 부족합니다. 다시 시도하세요.', 'err'); return; }
    const S = R.S, T = S[S.length-1].t, bias = S[S.length-1].v / T;
    let vv = 0, ss = 0;
    for (let i = 0; i < S.length; i++) {
      const p = S[i]; p.a -= bias;
      if (i > 0) { const q = S[i-1], dt = p.t - q.t; vv += (p.a + q.a)/2*dt; ss += vv*dt; }
      p.v = vv; p.s = ss;
    }
    R.bias = bias; R.state = 'done'; R.src = null;
    cur = key; refreshUI();
    msg(`[${LABEL[key]}] 기록 종료. 종료 시 정지 조건으로 드리프트 보정했습니다.`, 'ok');
  }

  function updateStats() {
    const R = runs[cur], S = R.S;
    const z = () => { for (const id of ['a','v','j','amax','vmax','jmax','amin','vmin','jmin']) $(id).textContent = '0.00';
      $('dur').textContent='0.0 s'; $('dist').textContent='0.00 m'; $('n').textContent='0'; };
    if (!S.length) { z(); $('bias').textContent = '—'; return; }
    const p = S[S.length-1];
    let aMx=-1e9,aMn=1e9,vMx=-1e9,vMn=1e9,jMx=-1e9,jMn=1e9;
    for (const q of S) { aMx=Math.max(aMx,q.a); aMn=Math.min(aMn,q.a); vMx=Math.max(vMx,q.v); vMn=Math.min(vMn,q.v); jMx=Math.max(jMx,q.j); jMn=Math.min(jMn,q.j); }
    $('a').textContent = p.a.toFixed(2); $('v').textContent = p.v.toFixed(2); $('j').textContent = p.j.toFixed(2);
    $('amax').textContent = aMx.toFixed(2); $('amin').textContent = aMn.toFixed(2);
    $('vmax').textContent = vMx.toFixed(2); $('vmin').textContent = vMn.toFixed(2);
    $('jmax').textContent = jMx.toFixed(2); $('jmin').textContent = jMn.toFixed(2);
    $('dur').textContent = p.t.toFixed(1) + ' s';
    $('dist').textContent = p.s.toFixed(2) + ' m';
    $('n').textContent = S.length;
    $('bias').textContent = R.src ? '(파일)' : R.bias == null ? '—' : (R.bias*1000).toFixed(1) + ' mm/s²';
  }

  const cv = $('cv'), ctx = cv.getContext('2d');
  function draw() {
    const R = runs[cur], S = R.S;
    const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== W*dpr) { cv.width = W*dpr; cv.height = H*dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const padL=8, padR=8, padT=10, padB=18, w = W-padL-padR, h = H-padT-padB, mid = padT + h/2;
    ctx.strokeStyle = '#2b3648'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, mid); ctx.lineTo(padL+w, mid); ctx.stroke();
    if (S.length > 1) {
      const T = Math.max(S[S.length-1].t, 5);
      const trace = (key, color, scale) => {
        ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.beginPath();
        for (let i = 0; i < S.length; i++) {
          const x = padL + S[i].t / T * w, y = mid - S[i][key] / scale * (h/2);
          i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
        }
        ctx.stroke();
      };
      let am=0.5, vm=0.5, jm=0.5;
      for (const q of S) { am = Math.max(am, Math.abs(q.a)); vm = Math.max(vm, Math.abs(q.v)); jm = Math.max(jm, Math.abs(q.j)); }
      trace('j', '#ff7d6e', jm*1.1); trace('v', '#5cc8ff', vm*1.1); trace('a', '#f2b33d', am*1.1);
      ctx.fillStyle = '#8d9ab0'; ctx.font = '11px system-ui'; ctx.textAlign = 'right';
      ctx.fillText(`±${am.toFixed(1)} m/s²  ±${vm.toFixed(2)} m/s  ±${jm.toFixed(1)} m/s³`, W-padR, H-4);
      ctx.textAlign = 'left'; ctx.fillText(`${LABEL[cur]}  0 – ${T.toFixed(0)} s`, padL, H-4);
    } else {
      ctx.fillStyle = '#8d9ab0'; ctx.font = '13px system-ui'; ctx.textAlign = 'center';
      ctx.fillText(`${LABEL[cur]} 데이터 없음`, W/2, mid - 6);
    }
    if (R.state === 'rec' && recRun === cur) { updateStats(); raf = requestAnimationFrame(draw); }
  }

  function refreshUI() {
    const R = runs[cur];
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.run === cur));
    for (const k of ['up','down']) {
      const d = $('dot-'+k), st = runs[k].state;
      d.className = 'dot' + (st === 'rec' || st === 'calib' ? ' rec' : runs[k].S.length ? ' has' : '');
    }
    $('fs').textContent = R.fsEst ? R.fsEst.toFixed(0) + ' Hz' : '— Hz';
    const go = $('go'); go.classList.remove('stop');
    if (recRun) {                         // 어딘가 기록 중
      go.disabled = recRun !== cur;
      go.textContent = recRun === cur ? '정지' : `${LABEL[recRun]} 기록 중`;
      if (recRun === cur) go.classList.add('stop');
    } else {
      go.disabled = false;
      go.textContent = R.S.length ? `${LABEL[cur]} 다시 측정` : `${LABEL[cur]} 시작`;
    }
    $('csv').disabled = !R.S.length || recRun === cur;
    $('reset').disabled = !R.S.length || !!recRun;
    $('load').disabled = !!recRun;
    updateStats(); draw();
  }

  async function start() {
    if (recRun === cur) return finish();
    if (recRun) return;
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission();
        if (r !== 'granted') { msg('모션 센서 권한이 거부되었습니다.', 'err'); return; }
      }
      if (!('DeviceMotionEvent' in window)) { msg('이 브라우저는 모션 센서를 지원하지 않습니다.', 'err'); return; }
      if (!isSecureContext) { msg('HTTPS에서만 센서를 사용할 수 있습니다.', 'err'); return; }
      try { wake = await navigator.wakeLock?.request('screen'); } catch(_) {}
      const R = runs[cur]; R.S = []; R.bias = null; R.src = null; R.fsEst = 0; R.state = 'calib';
      recRun = cur; calibBuf = [];
      window.addEventListener('devicemotion', onMotion);
      refreshUI();
      msg(`[${LABEL[cur]}] 영점 잡는 중… 2초간 움직이지 마세요.`);
      setTimeout(() => { if (runs[recRun]?.state === 'calib' && calibBuf.length === 0) msg('센서 데이터가 들어오지 않습니다. Chrome에서 열었는지 확인하세요.', 'err'); }, 1500);
    } catch (e) { msg('시작 실패: ' + e.message, 'err'); }
  }

  function reset() {
    if (recRun) return;
    runs[cur] = newRun();
    refreshUI(); msg(`[${LABEL[cur]}] 초기화됨.`);
  }

  function exportCsv() {
    const S = runs[cur].S; if (!S.length) return;
    const rows = ['t_s,a_raw_mps2,a_filt_mps2,v_mps,jerk_mps3,s_m'];
    for (const p of S) rows.push([p.t.toFixed(4), p.ar.toFixed(4), p.a.toFixed(4), p.v.toFixed(4), p.j.toFixed(4), p.s.toFixed(4)].join(','));
    const blob = new Blob([rows.join('\n')], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `elevator_${cur}_` + new Date().toISOString().replace(/[:.]/g,'-').slice(0,19) + '.csv';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function importCsv(file) {
    const rd = new FileReader();
    rd.onload = () => {
      const lines = rd.result.split(/\r?\n/).filter(l => l.trim());
      const head = lines[0].split(',').map(h => h.trim());
      const col = n => head.indexOf(n);
      const iT=col('t_s'), iAr=col('a_raw_mps2'), iA=col('a_filt_mps2'), iV=col('v_mps'), iJ=col('jerk_mps3'), iS=col('s_m');
      if (iT<0 || iA<0) { msg('이 앱에서 저장한 CSV 형식이 아닙니다 (t_s, a_filt_mps2 열 필요).', 'err'); return; }
      const out = [];
      for (let i = 1; i < lines.length; i++) {
        const c = lines[i].split(',').map(Number);
        if (!isFinite(c[iT])) continue;
        out.push({t:c[iT], ar:iAr>=0?c[iAr]:c[iA], a:c[iA], v:iV>=0?c[iV]:0, j:iJ>=0?c[iJ]:0, s:iS>=0?c[iS]:0});
      }
      if (out.length < 2) { msg('데이터 행이 없습니다.', 'err'); return; }
      // 파일명에 up/down 이 있으면 해당 탭으로, 없으면 현재 탭으로
      const name = file.name.toLowerCase();
      const key = /_down[_.]/.test(name) ? 'down' : /_up[_.]/.test(name) ? 'up' : cur;
      const R = newRun(); R.S = out; R.state = 'done'; R.src = file.name;
      R.fsEst = (out.length-1) / out[out.length-1].t;
      runs[key] = R; cur = key;
      refreshUI(); msg(`[${LABEL[key]}] 불러옴: ${file.name}`, 'ok');
    };
    rd.readAsText(file);
  }

  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { cur = b.dataset.run; refreshUI(); });
  $('load').onclick = () => $('file').click();
  $('file').onchange = e => { if (e.target.files[0]) importCsv(e.target.files[0]); e.target.value = ''; };
  $('go').onclick = start; $('reset').onclick = reset; $('csv').onclick = exportCsv;
  addEventListener('resize', draw);
  refreshUI(); msg(IDLE_MSG);
})();
</script>
</body>
</html>
