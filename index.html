<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151b25">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="mobile-web-app-capable" content="yes">
<title>승강기 주행 계측</title>
<style>
  :root{
    --bg:#151b25; --panel:#1d2532; --line:#2b3648; --ink:#e8edf5; --dim:#8d9ab0;
    --acc:#f2b33d; --vel:#5cc8ff; --jrk:#ff7d6e; --ok:#63d39a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;-webkit-user-select:none;user-select:none}
  body{padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 14px);max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:100dvh;gap:10px}
  header{display:flex;align-items:baseline;justify-content:space-between;padding-top:12px}
  header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
  header span{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
  .tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:10px;padding:4px;gap:4px}
  .tab{border:0;border-radius:7px;padding:9px;font-size:15px;font-weight:600;background:transparent;color:var(--dim);font-family:inherit}
  .tab.on{background:var(--ink);color:var(--bg)}
  .trials{display:flex;gap:6px;align-items:center}
  .trials .chip{flex:1;border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:8px;padding:8px 0;font-size:14px;font-weight:600;display:flex;justify-content:center;gap:6px;align-items:center}
  .trials .chip.on{border-color:var(--acc);color:var(--ink)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .dot.has{background:var(--ok)} .dot.rec{background:var(--jrk)}
  .trials select{padding:6px 4px;font-size:12px}
  .readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ro{background:var(--panel);border-radius:10px;padding:10px 10px 8px;border-top:3px solid var(--c)}
  .ro .k{font-size:12px;color:var(--dim)}
  .ro .v{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px;color:var(--c)}
  .ro .u{font-size:11px;color:var(--dim)}
  .ro .p{font-size:12px;color:var(--ink);margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.5}
  .ro .p em{font-style:normal;color:var(--dim)}
  canvas{width:100%;height:220px;background:var(--panel);border-radius:10px;display:block}
  .legend{display:flex;gap:12px;font-size:12px;color:var(--dim);padding:0 4px;align-items:center}
  .legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  .legend .spacer{flex:1}
  .lg{border:0;background:transparent;color:var(--dim);font-size:12px;padding:4px 6px;border-radius:6px;font-family:inherit;font-weight:500;opacity:.4}
  .lg.on{opacity:1;color:var(--ink)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:0;background:transparent;color:var(--dim);padding:5px 9px;font-size:12px;font-weight:500}
  .seg button.on{background:var(--line);color:var(--ink)}
  .stats{background:var(--panel);border-radius:10px;padding:10px 12px;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-variant-numeric:tabular-nums}
  .stats b{font-weight:500;color:var(--dim)}
  #peaks{grid-column:1/-1;display:none;padding-top:4px;border-top:1px solid var(--line);margin-top:2px}
  #peaks span{display:inline-block;margin-right:10px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .row label{font-size:12px;color:var(--dim)}
  select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;font-family:inherit}
  .spacer{flex:1}
  details{background:var(--panel);border-radius:10px;padding:8px 12px;font-size:12px}
  summary{cursor:pointer;color:var(--dim);font-weight:500}
  table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:4px 2px;border-top:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim);font-weight:500;font-size:11px}
  td:first-child,th:first-child{text-align:left}
  .btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}
  #msg{order:0}
  button.mic{grid-column:1/-1;background:var(--panel);color:var(--dim);border:1px solid var(--line);font-size:13px;padding:10px}
  button.mic.on{background:var(--ok);color:var(--bg);border-color:var(--ok)}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
  details .row button{border-radius:8px}
  .meta input{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:8px;font-size:13px;font-family:inherit;min-width:0}
  button{border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:600;color:var(--bg);background:var(--ink);font-family:inherit}
  button.main{width:100%;background:var(--acc);padding:15px}
  button.main.stop{background:var(--jrk)}
  button.sub{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:14px;padding:12px}
  button:disabled{opacity:.4}
  button:focus-visible{outline:2px solid var(--vel);outline-offset:2px}
  #msg{font-size:13px;color:var(--dim);min-height:18px;text-align:center}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--jrk)}
</style>
</head>
<body>
<header>
  <h1>승강기 주행 계측</h1>
  <span id="fs">— Hz</span>
</header>

<div class="tabs">
  <button class="tab on" data-dir="up">상승</button>
  <button class="tab" data-dir="down">하강</button>
</div>
<div class="trials" id="trials"></div>
<button class="main" id="go">시작</button>
<div id="msg"></div>
<div class="row" style="gap:6px">
  <label for="axis">표시 축</label>
  <select id="axis" style="flex:1"><option value="v" selected>수직 (가속도·속도·저크)</option><option value="x">수평 전후 (진동)</option><option value="y">수평 좌우 (진동)</option></select>
</div>

<div class="readouts">
  <div class="ro" style="--c:var(--acc)"><div class="k" id="k1">가속도</div><div class="v" id="a">0.00</div><div class="u" id="u1">m/s²</div><div class="p"><em>max</em> <span id="amax">0.00</span><br><em>min</em> <span id="amin">0.00</span></div></div>
  <div class="ro" style="--c:var(--vel)"><div class="k" id="k2">속도</div><div class="v" id="v">0.00</div><div class="u" id="u2">m/s</div><div class="p"><em>max</em> <span id="vmax">0.00</span><br><em>min</em> <span id="vmin">0.00</span></div></div>
  <div class="ro" style="--c:var(--jrk)"><div class="k" id="k3">저크</div><div class="v" id="j">0.00</div><div class="u" id="u3">m/s³</div><div class="p"><em>max</em> <span id="jmax">0.00</span><br><em>min</em> <span id="jmin">0.00</span></div></div>
</div>

<canvas id="cv"></canvas>
<div class="legend">
  <span id="lg-time"><button class="lg on" data-tr="a"><i style="background:var(--acc)"></i>가속도</button><button class="lg on" data-tr="v"><i style="background:var(--vel)"></i>속도</button><button class="lg on" data-tr="j"><i style="background:var(--jrk)"></i>저크</button><button class="lg" data-tr="x"><i style="background:#9b8cff"></i>전후</button><button class="lg" data-tr="y"><i style="background:#63d39a"></i>좌우</button><button class="lg" data-tr="ar"><i style="background:#8d9ab0"></i>원시</button></span>
  <span id="lg-fft" style="display:none"><i style="background:var(--acc)"></i>원시 가속도 스펙트럼</span>
  <span class="spacer"></span>
  <span class="seg"><button class="on" data-view="time">시간</button><button data-view="fft">스펙트럼</button></span>
</div>

<div class="stats">
  <div><b>주행 시간</b> <span id="dur">0.0 s</span></div>
  <div><b>이동 거리</b> <span id="dist">0.00 m</span></div>
  <div><b>드리프트 보정</b> <span id="bias">—</span></div>
  <div><b>샘플 수</b> <span id="n">0</span></div>
  <div id="horiz" style="grid-column:1/-1"></div>
  <div id="isoBox" style="grid-column:1/-1"></div>
  <div id="rbBox" style="grid-column:1/-1"></div>
  <div id="peaks"></div>
</div>

<div class="row">
  <label for="fc">LPF</label>
  <select id="fc"><option value="2">2 Hz</option><option value="3" selected>3 Hz</option><option value="5">5 Hz</option><option value="8">8 Hz</option></select>
  <label for="jfc">저크</label>
  <select id="jfc"><option value="1">1 Hz</option><option value="2" selected>2 Hz</option><option value="4">4 Hz</option></select>
  <span class="spacer"></span>
  <label for="rate">샘플링</label>
  <select id="rate"><option value="0">자동(60)</option><option value="100">100 Hz</option><option value="200" selected>200 Hz</option><option value="400">400 Hz</option></select>
  <label for="auto">자동정지</label>
  <select id="auto"><option value="0">끔</option><option value="1" selected>1 s</option><option value="2">2 s</option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option><option value="15">15 s</option><option value="20">20 s</option><option value="30">30 s</option><option value="45">45 s</option><option value="60">60 s</option></select>
  <label for="fax">FFT 축</label>
  <select id="fax"><option value="ar" selected>수직</option><option value="xr">전후</option><option value="yr">좌우</option></select>
  <label for="fseg">FFT 구간</label>
  <select id="fseg"><option value="const" selected>등속</option><option value="acc">가속</option><option value="dec">감속</option><option value="all">전체</option></select>
</div>

<details><summary>시험 결과 요약 (전 회차)</summary><table id="sum"></table></details>
<details><summary>리포트 정보</summary>
  <div class="meta">
    <input id="m-site" placeholder="현장명"><input id="m-unit" placeholder="호기 / 기종">
    <input id="m-spec" placeholder="정격 속도·적재 (예: 1.0 m/s, 1000 kg)"><input id="m-by" placeholder="측정자">
    <input id="m-addr" placeholder="주소 (위치 확인 시 자동)" style="grid-column:1/-1">
  </div>
  <div class="row" style="margin-top:6px">
    <button class="sub" id="geo" style="padding:8px 12px;flex:0 0 auto">현재 위치로 현장 확인</button>
    <span id="geotxt" style="font-size:11.5px;color:var(--dim)">좌표 없음</span>
  </div>
</details>

<div class="btns">
  <button class="sub" id="csv" disabled>CSV 저장</button>
  <button class="sub" id="load">CSV 불러오기</button>
  <button class="sub" id="reset" disabled>초기화</button>
  <button class="sub" id="report">리포트</button>
  <button class="mic" id="mic">🎤 음성 명령 꺼짐</button>
  <input type="file" id="file" accept=".csv,text/csv" hidden>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const msg = (t, cls='') => { $('msg').textContent = t; $('msg').className = cls; };
  const IDLE_MSG = '휴대폰을 카 바닥이나 손잡이에 고정하고, 정지 상태에서 시작을 누르세요.';
  const DIR = { up:'상승', down:'하강' };
  const label = k => DIR[k.dir] + ' ' + k.n + '회';
  const kid = k => k.dir + k.n;

  // ---- 데이터: runs['up1'..'down5'] ----
  const newRun = () => ({ S:[], state:'idle', fsEst:0, bias:null, src:null });
  let runs = {}, nTrials = 3;
  let cur = { dir:'up', n:1 };   // 표시 중
  let recKey = null;             // 기록 중인 run id
  let view = 'time';
  const show = { a:true, v:true, j:true, ar:false, x:false, y:false };
  const R_ = k => runs[k] || (runs[k] = newRun());

  // ---- 영속 저장 (기기 브라우저 로컬) ----
  function save() {
    try {
      const o = { nTrials, runs:{} };
      for (const k in runs) if (runs[k].S.length && runs[k].state === 'done')
        o.runs[k] = { S:runs[k].S.map(p => [p.t,p.ar,p.a,p.v,p.j,p.s,p.xr||0,p.yr||0,p.x||0,p.y||0,p.jx||0,p.jy||0].map(x => +x.toFixed(4))), fsEst:runs[k].fsEst, bias:runs[k].bias, src:runs[k].src };
      localStorage.setItem('erm2', JSON.stringify(o));
    } catch(_) {}
  }
  function load() {
    try {
      const o = JSON.parse(localStorage.getItem('erm2') || 'null'); if (!o) return;
      nTrials = o.nTrials || 3;
      for (const k in o.runs) { const r = newRun(); r.S = o.runs[k].S.map(x => ({t:x[0],ar:x[1],a:x[2],v:x[3],j:x[4],s:x[5],xr:x[6]||0,yr:x[7]||0,x:x[8]||0,y:x[9]||0,jx:x[10]||0,jy:x[11]||0})); r.fsEst = o.runs[k].fsEst; r.bias = o.runs[k].bias; r.src = o.runs[k].src; r.state = 'done'; runs[k] = r; }
    } catch(_) {}
  }

  // ---- 기록 ----
  let ghat = null, h1 = null, h2 = null, gmag = 9.81, calibBuf = [];
  let t0 = 0, lastT = 0, lastA = 0, lastX = 0, lastY = 0, v = 0, s = 0;
  const aSt = [0,0], jSt = [0,0], xSt = [0,0], ySt = [0,0], jxSt = [0,0], jySt = [0,0];
  let wake = null, raf = 0;
  let phase = 'wait', phT = 0, sA = 0; // 자동정지 상태기계
  let sensor = null, srcName = '';

  // 고주파 경로: Generic Sensor API(Accelerometer) 우선, 실패 시 devicemotion(60 Hz 상한)
  async function startSensor() {
    const want = +$('rate').value;
    if (want > 0 && 'Accelerometer' in window) {
      try {
        if (navigator.permissions) {
          const st = await navigator.permissions.query({ name:'accelerometer' });
          if (st.state === 'denied') throw new Error('denied');
        }
        const sn = new Accelerometer({ frequency: want, referenceFrame: 'device' });
        await new Promise((res, rej) => {
          let ok = false;
          sn.onreading = () => { ok = true; res(); };
          sn.onerror = ev => rej(ev.error || new Error('sensor error'));
          sn.start();
          setTimeout(() => ok || rej(new Error('no reading')), 1200);
        });
        sn.onreading = () => onSample(sn.x, sn.y, sn.z);
        sensor = sn; srcName = 'Sensor API';
        return true;
      } catch (e) { try { sensor?.stop(); } catch(_) {} sensor = null; }
    }
    window.addEventListener('devicemotion', onMotion);
    srcName = 'DeviceMotion'; return true;
  }
  function stopSensor() {
    if (sensor) { try { sensor.onreading = null; sensor.stop(); } catch(_) {} sensor = null; }
    window.removeEventListener('devicemotion', onMotion);
  }

  function lpf(x, dt, fc, st) {
    const rc = 1 / (2 * Math.PI * fc), al = dt / (rc + dt);
    st[0] += al * (x - st[0]); st[1] += al * (st[0] - st[1]); return st[1];
  }

  function onMotion(e) {
    const g = e.accelerationIncludingGravity;
    if (!g || g.x == null) return;
    onSample(g.x, g.y, g.z);
  }
  function onSample(gx, gy, gz) {
    if (!recKey) return;
    const R = runs[recKey], now = performance.now() / 1000;
    if (R.state === 'calib') {
      calibBuf.push([gx, gy, gz, now]);
      if (now - calibBuf[0][3] >= 2.0) {
        const n = calibBuf.length;
        const m = calibBuf.reduce((p,c)=>[p[0]+c[0],p[1]+c[1],p[2]+c[2]],[0,0,0]).map(x=>x/n);
        gmag = Math.hypot(...m); ghat = m.map(x => x / gmag);
        // 수평면 직교 기저: 기기 Y축(세로)을 수평면에 투영 → h1(전후 가정), h2 = ghat × h1(좌우)
        let ref = [0,1,0];
        if (Math.abs(ghat[1]) > 0.9) ref = [0,0,1];
        const d = ref[0]*ghat[0] + ref[1]*ghat[1] + ref[2]*ghat[2];
        let h = [ref[0]-d*ghat[0], ref[1]-d*ghat[1], ref[2]-d*ghat[2]];
        const hn = Math.hypot(...h); h1 = h.map(x => x/hn);
        h2 = [ghat[1]*h1[2]-ghat[2]*h1[1], ghat[2]*h1[0]-ghat[0]*h1[2], ghat[0]*h1[1]-ghat[1]*h1[0]];
        xSt[0]=xSt[1]=0; ySt[0]=ySt[1]=0; jxSt[0]=jxSt[1]=0; jySt[0]=jySt[1]=0; lastX = 0; lastY = 0;
        R.fsEst = n / (now - calibBuf[0][3]);
        aSt[0]=aSt[1]=0; jSt[0]=jSt[1]=0;
        t0 = now; lastT = now; lastA = 0; v = 0; s = 0; R.S = [];
        phase = 'wait'; phT = 0; sA = 0;
        R.state = 'rec'; refreshUI(); setPhase();
        msg(`[${label(cur)}] 영점 완료 · ${srcName} ${R.fsEst.toFixed(0)} Hz (|g| = ${gmag.toFixed(3)}). 기록 중 — 주행 후 정지.`, 'ok');
        raf = requestAnimationFrame(draw);
      }
      return;
    }
    if (R.state !== 'rec') return;
    const dt = now - lastT; if (dt <= 0 || dt > 0.5) { lastT = now; return; }
    lastT = now;
    const t = now - t0;
    const fc = +$('fc').value;
    const ar = gx*ghat[0] + gy*ghat[1] + gz*ghat[2] - gmag;
    const xr = gx*h1[0] + gy*h1[1] + gz*h1[2];
    const yr = gx*h2[0] + gy*h2[1] + gz*h2[2];
    const a = lpf(ar, dt, fc, aSt);
    const j = lpf((a - lastA) / dt, dt, +$('jfc').value, jSt);
    const x = lpf(xr, dt, fc, xSt), y = lpf(yr, dt, fc, ySt);
    const jfc = +$('jfc').value;
    const jx = lpf((x - lastX) / dt, dt, jfc, jxSt), jy = lpf((y - lastY) / dt, dt, jfc, jySt);
    lastX = x; lastY = y;
    v += (a + lastA) / 2 * dt; s += v * dt; lastA = a;
    R.S.push({t, ar, a, v, j, s, xr, yr, x, y, jx, jy});

    // 자동 정지: 속도 패턴 인식. 가속(부호 sA) → [등속] → 감속(부호 -sA) → 정지(|a|<0.05 가 hold 초 지속)
    const hold = +$('auto').value;
    if (hold > 0) {
      const HI = 0.15, LO = 0.05;
      if (phase === 'wait') {
        if (Math.abs(a) > HI) { phT += dt; if (phT >= 0.3) { phase = 'acc'; sA = Math.sign(a); phT = 0; setPhase(); } } else phT = 0;
      } else if (phase === 'acc' || phase === 'cruise') {
        if (a * sA < -HI) { phT += dt; if (phT >= 0.3) { phase = 'dec'; phT = 0; setPhase(); } }
        else { phT = 0; if (phase === 'acc' && Math.abs(a) < LO) { phase = 'cruise'; setPhase(); } }
      } else if (phase === 'dec') {
        if (Math.abs(a) < LO) { phT += dt; if (phT >= hold) { finish(true); return; } }
        else if (a * sA < -HI) phT = 0;   // 아직 감속 중
        else phT = 0;
      }
    }
  }
  const PH = { wait:'대기', acc:'가속', cruise:'등속', dec:'감속' };
  function setPhase() { if (recKey) $('fs').textContent = runs[recKey].fsEst.toFixed(0) + ' Hz · ' + PH[phase]; }

  function finish(auto) {
    const key = recKey, R = runs[key];
    stopSensor();
    cancelAnimationFrame(raf);
    if (wake) { wake.release(); wake = null; }
    recKey = null;
    if (R.S.length < 10) { runs[key] = newRun(); refreshUI(); msg('데이터가 부족합니다. 다시 시도하세요.', 'err'); return; }
    const S = R.S, T = S[S.length-1].t, bias = S[S.length-1].v / T;
    let vv = 0, ss = 0;
    for (let i = 0; i < S.length; i++) {
      const p = S[i]; p.a -= bias;
      if (i > 0) { const q = S[i-1], dt = p.t - q.t; vv += (p.a + q.a)/2*dt; ss += vv*dt; }
      p.v = vv; p.s = ss;
    }
    R.bias = bias; R.state = 'done'; R.src = null;
    save(); refreshUI();
    msg(`[${label(cur)}] ${auto ? '정지 감지 → 자동 종료' : '기록 종료'}. 종료 시 정지 조건으로 드리프트 보정했습니다.`, 'ok');
    if (auto && navigator.vibrate) navigator.vibrate([80,60,80]);
  }

  // ---- 통계 ----
  function stats(S) {
    let o = {aMx:-1e9,aMn:1e9,vMx:-1e9,vMn:1e9,jMx:-1e9,jMn:1e9};
    for (const q of S) { o.aMx=Math.max(o.aMx,q.a); o.aMn=Math.min(o.aMn,q.a); o.vMx=Math.max(o.vMx,q.v); o.vMn=Math.min(o.vMn,q.v); o.jMx=Math.max(o.jMx,q.j); o.jMn=Math.min(o.jMn,q.j); }
    return o;
  }
  function axStats(S, k) {
    let mx=-1e9, mn=1e9, m=0;
    for (const q of S) { const u = q[k]||0; mx = Math.max(mx,u); mn = Math.min(mn,u); m += u; }
    m /= S.length;
    let sq = 0; for (const q of S) { const u = (q[k]||0) - m; sq += u*u; }
    return { mx, mn, pp: mx-mn, rms: Math.sqrt(sq/S.length), mean: m };
  }
  function horizStats(S) {
    if (!S.length || S[0].x === undefined) return null;
    let xMx=-1e9,xMn=1e9,yMx=-1e9,yMn=1e9,sx=0,sy=0,mx=0,my=0;
    for (const q of S) { mx += q.x; my += q.y; }
    mx /= S.length; my /= S.length;
    for (const q of S) { xMx=Math.max(xMx,q.x); xMn=Math.min(xMn,q.x); yMx=Math.max(yMx,q.y); yMn=Math.min(yMn,q.y);
      sx += (q.x-mx)*(q.x-mx); sy += (q.y-my)*(q.y-my); }
    return { xpp:xMx-xMn, ypp:yMx-yMn, xrms:Math.sqrt(sx/S.length), yrms:Math.sqrt(sy/S.length), xMx, xMn, yMx, yMn };
  }
  function updateStats() {
    const R = R_(kid(cur)), S = R.S;
    if (!S.length) {
      for (const id of ['a','v','j','amax','vmax','jmax','amin','vmin','jmin']) $(id).textContent = '0.00';
      $('dur').textContent='0.0 s'; $('dist').textContent='0.00 m'; $('n').textContent='0'; $('bias').textContent='—'; return;
    }
    const p = S[S.length-1], o = stats(S), ax = $('axis').value;
    if (ax === 'v') {
      $('k1').textContent = '가속도'; $('u1').textContent = 'm/s²';
      $('k2').textContent = '속도';   $('u2').textContent = 'm/s';
      $('k3').textContent = '저크';   $('u3').textContent = 'm/s³';
      $('a').textContent = p.a.toFixed(2); $('v').textContent = p.v.toFixed(2); $('j').textContent = p.j.toFixed(2);
      $('amax').textContent = o.aMx.toFixed(2); $('amin').textContent = o.aMn.toFixed(2);
      $('vmax').textContent = o.vMx.toFixed(2); $('vmin').textContent = o.vMn.toFixed(2);
      $('jmax').textContent = o.jMx.toFixed(2); $('jmin').textContent = o.jMn.toFixed(2);
    } else {
      const k = ax, jk = ax === 'x' ? 'jx' : 'jy', nm = ax === 'x' ? '전후' : '좌우';
      const ac = axStats(S, k), jc = axStats(S, jk);
      $('k1').textContent = '가속도 ' + nm; $('u1').textContent = 'm/s²';
      $('k2').textContent = 'RMS ' + nm;    $('u2').textContent = 'm/s²';
      $('k3').textContent = '저크 ' + nm;   $('u3').textContent = 'm/s³';
      $('a').textContent = (p[k]||0).toFixed(3); $('v').textContent = ac.rms.toFixed(3); $('j').textContent = (p[jk]||0).toFixed(2);
      $('amax').textContent = ac.mx.toFixed(3); $('amin').textContent = ac.mn.toFixed(3);
      $('vmax').textContent = ac.pp.toFixed(3); $('vmin').textContent = '(p-p)';
      $('jmax').textContent = jc.mx.toFixed(2); $('jmin').textContent = jc.mn.toFixed(2);
    }
    $('dur').textContent = p.t.toFixed(1) + ' s'; $('dist').textContent = p.s.toFixed(2) + ' m'; $('n').textContent = S.length;
    $('bias').textContent = R.src ? '(파일)' : R.bias == null ? '—' : (R.bias*1000).toFixed(1) + ' mm/s²';
    const hz = horizStats(S);
    const iso = R.done ? isoCalc(R) : null;
    $('isoBox').innerHTML = iso ? `<b>ISO 18738 (참고)</b> 등속 ${iso.cvDur.toFixed(1)}s${iso.full?'(전체 대체)':''} · VPPV 수직 max ${iso.z.max.toFixed(3)} / A95 ${iso.z.a95.toFixed(3)} · 전후 ${iso.x.max.toFixed(3)}/${iso.x.a95.toFixed(3)} · 좌우 ${iso.y.max.toFixed(3)}/${iso.y.a95.toFixed(3)} m/s²<br>최대 가속 ${iso.aMax.toFixed(2)} · 감속 ${iso.dMax.toFixed(2)} m/s² · 최대 저크 ${iso.jMax.toFixed(2)} m/s³ · 최대 속도 ${iso.vMax.toFixed(2)} m/s` : '';
    const rb = R.done ? rollback(R) : null;
    $('rbBox').innerHTML = !rb ? '' : rb.short ? '<b>안티롤백</b> 출발 전 정지 구간이 짧아 분석 불가 (주행 전 0.5 s 이상 기록 필요)'
      : rb.none ? `<b>안티롤백</b> 가속 개시 전 유의 거동 없음 (잡음 ${(rb.sd*1000).toFixed(1)} mm/s²)`
      : `<b>안티롤백</b> 개방 ${rb.tBr.toFixed(2)}s → 가속 ${rb.tOn.toFixed(2)}s (${(rb.T*1000).toFixed(0)} ms) · 변위 ${(rb.xPk*1000).toFixed(1)} mm · 속도 ${(rb.vPk*1000).toFixed(1)} mm/s · ${rbDir(rb)}${rb.valid ? '' : ` · 잡음 한계 ±${(rb.xNoise*1000).toFixed(1)} mm 이내로 유의성 낮음`}`;
    $('horiz').innerHTML = hz ? `<b>수평 진동</b> 전후 p-p ${hz.xpp.toFixed(3)} · rms ${hz.xrms.toFixed(3)} / 좌우 p-p ${hz.ypp.toFixed(3)} · rms ${hz.yrms.toFixed(3)} m/s²` : '';
  }
  function updateSummary() {
    let h = '<tr><th>회차</th><th>a max/min</th><th>v max/min</th><th>j max/min</th><th>거리</th></tr>';
    for (const dir of ['up','down']) for (let n = 1; n <= nTrials; n++) {
      const R = runs[dir+n];
      if (!R || !R.S.length) { h += `<tr><td>${DIR[dir]} ${n}</td><td colspan="4" style="color:var(--dim)">—</td></tr>`; continue; }
      const o = stats(R.S), f = x => x.toFixed(2);
      h += `<tr><td>${DIR[dir]} ${n}</td><td>${f(o.aMx)} / ${f(o.aMn)}</td><td>${f(o.vMx)} / ${f(o.vMn)}</td><td>${f(o.jMx)} / ${f(o.jMn)}</td><td>${f(R.S[R.S.length-1].s)}</td></tr>`;
    }
    $('sum').innerHTML = h;
  }

  // ---- FFT ----
  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
      if (i < j) { [re[i],re[j]] = [re[j],re[i]]; [im[i],im[j]] = [im[j],im[i]]; } }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len/2; k++) {
          const ur = re[i+k], ui = im[i+k], xr = re[i+k+len/2], xi = im[i+k+len/2];
          const vr = xr*cr - xi*ci, vi = xr*ci + xi*cr;
          re[i+k] = ur+vr; im[i+k] = ui+vi; re[i+k+len/2] = ur-vr; im[i+k+len/2] = ui-vi;
          const t = cr*wr - ci*wi; ci = cr*wi + ci*wr; cr = t;
        }
      }
    }
  }
  // 구간 분할: 최초 |a|>0.1 m/s² 이후 ~ |v|가 최대의 90%에 처음 도달 = 가속,
  // 마지막으로 90% 이상인 지점 ~ 마지막 |a|>0.1 = 감속, 그 사이 = 등속
  function segments(S) {
    const n = S.length; if (n < 10) return null;
    let vm = 0; for (const p of S) vm = Math.max(vm, Math.abs(p.v));
    if (vm < 0.05) return null;
    let i0 = 0; while (i0 < n && Math.abs(S[i0].a) < 0.1) i0++;
    let i3 = n-1; while (i3 > 0 && Math.abs(S[i3].a) < 0.1) i3--;
    let i1 = i0; while (i1 < n && Math.abs(S[i1].v) < 0.9*vm) i1++;
    let i2 = i3; while (i2 > 0 && Math.abs(S[i2].v) < 0.9*vm) i2--;
    if (!(i0 < i1 && i1 <= i2 && i2 < i3)) return null;
    return { acc:[i0,i1], const:[i1,i2], dec:[i2,i3], all:[0,n-1] };
  }
  const SEGNAME = { acc:'가속', const:'등속', dec:'감속', all:'전체' };
  function spectrum(R, wantArg, axArg) {
    const full = R.S; if (full.length < 32) return null;
    const want = wantArg || $('fseg').value, seg = segments(full);
    let S = full, used = 'all';
    if (want !== 'all' && seg) { const [a,b] = seg[want]; if (b-a+1 >= 32) { S = full.slice(a, b+1); used = want; } }
    const fs = (S.length-1) / (S[S.length-1].t - S[0].t);
    const ax = axArg || $('fax').value;
    const mean = S.reduce((a,p)=>a+(p[ax]||0),0)/S.length;
    let n = 1; while (n < S.length) n <<= 1;
    const re = new Float64Array(n), im = new Float64Array(n);
    for (let i = 0; i < S.length; i++) { const w = 0.5 - 0.5*Math.cos(2*Math.PI*i/(S.length-1)); re[i] = ((S[i][ax]||0) - mean) * w; }
    fft(re, im);
    const half = n/2, amp = new Float64Array(half), df = fs/n;
    for (let k = 0; k < half; k++) amp[k] = 2 * Math.hypot(re[k], im[k]) / (S.length * 0.5); // Hann 코히런트 게인 0.5 보정
    const peaks = [];
    for (let k = 2; k < half-1; k++) if (k*df >= 0.3 && amp[k] > amp[k-1] && amp[k] >= amp[k+1]) peaks.push({f:k*df, a:amp[k]});
    peaks.sort((x,y) => y.a - x.a);
    const dur = S[S.length-1].t - S[0].t;
    const AXN = { ar:'수직', xr:'전후', yr:'좌우' };
    return { amp, df, fs, peaks: peaks.slice(0,5), nSeg:S.length, dur, seg: SEGNAME[used], fallback: used !== want, axis: AXN[ax] };
  }

  // ---- 그리기 ----
  const cv = $('cv'), ctx = cv.getContext('2d');
  function draw() {
    const R = R_(kid(cur)), S = R.S;
    const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    if (cv.width !== W*dpr) { cv.width = W*dpr; cv.height = H*dpr; }
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    const padL=8, padR=8, padT=10, padB=18, w = W-padL-padR, h = H-padT-padB;
    ctx.font = '11px system-ui'; ctx.fillStyle = '#8d9ab0';
    const empty = t => { ctx.font = '13px system-ui'; ctx.textAlign = 'center'; ctx.fillText(t, W/2, H/2 - 6); };

    if (view === 'fft') {
      $('peaks').style.display = 'block';
      const sp = R.state === 'done' ? spectrum(R) : null;
      if (!sp) { empty(`${label(cur)} 스펙트럼 없음 (기록 완료 후 표시)`); $('peaks').innerHTML = ''; return; }
      const fmax = sp.fs/2, base = padT + h;
      let am = 0; for (let k = 1; k < sp.amp.length; k++) am = Math.max(am, sp.amp[k]); am = am || 1;
      ctx.strokeStyle = '#2b3648'; ctx.lineWidth = 1;
      const step = fmax > 120 ? 50 : fmax > 60 ? 25 : fmax > 35 ? 10 : 5;
      for (let f = step; f < fmax; f += step) { const x = padL + f/fmax*w; ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,base); ctx.stroke(); ctx.textAlign='center'; ctx.fillText(f+'', x, H-4); }
      ctx.strokeStyle = '#f2b33d'; ctx.lineWidth = 1.6; ctx.beginPath();
      for (let k = 1; k < sp.amp.length; k++) { const x = padL + k*sp.df/fmax*w, y = base - sp.amp[k]/am*h; k===1 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); }
      ctx.stroke();
      ctx.fillStyle = '#ff7d6e';
      for (const p of sp.peaks.slice(0,3)) { const x = padL + p.f/fmax*w, y = base - p.a/am*h; ctx.beginPath(); ctx.arc(x,y,3,0,7); ctx.fill(); }
      ctx.fillStyle = '#8d9ab0'; ctx.textAlign = 'right'; ctx.fillText(`${sp.axis} · ${sp.seg}${sp.fallback?'(구간 부족→전체)':''} ${sp.dur.toFixed(1)}s ${sp.nSeg}샘플 @${sp.fs.toFixed(0)}Hz  Δf ${sp.df.toFixed(2)}Hz  peak ${am.toFixed(3)} m/s²`, W-padR, padT+10);
      ctx.textAlign = 'left'; ctx.fillText('Hz', padL, H-4);
      $('peaks').innerHTML = '<b>피크</b> ' + sp.peaks.map(p => `<span>${p.f.toFixed(2)} Hz · ${p.a.toFixed(3)}</span>`).join('');
      return;
    }

    $('peaks').style.display = 'none';
    const mid = padT + h/2;
    ctx.strokeStyle = '#2b3648'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(padL, mid); ctx.lineTo(padL+w, mid); ctx.stroke();
    if (S.length > 1) {
      const T = Math.max(S[S.length-1].t, 5);
      const trace = (key, color, scale) => {
        ctx.strokeStyle = color; ctx.lineWidth = 1.6; ctx.beginPath();
        for (let i = 0; i < S.length; i++) { const x = padL + S[i].t / T * w, y = mid - S[i][key] / scale * (h/2); i ? ctx.lineTo(x,y) : ctx.moveTo(x,y); }
        ctx.stroke();
      };
      let am=0.5, vm=0.5, jm=0.5, hm=0.2;
      for (const q of S) { am = Math.max(am, Math.abs(q.a)); vm = Math.max(vm, Math.abs(q.v)); jm = Math.max(jm, Math.abs(q.j));
        hm = Math.max(hm, Math.abs(q.x||0), Math.abs(q.y||0)); }
      const seg = R.state === 'done' ? segments(S) : null;
      if (seg) {
        ctx.strokeStyle = '#3f4d63'; ctx.setLineDash([3,3]); ctx.lineWidth = 1;
        for (const i of [seg.acc[0], seg.acc[1], seg.dec[0], seg.dec[1]]) { const x = padL + S[i].t/T*w; ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,padT+h); ctx.stroke(); }
        ctx.setLineDash([]); ctx.fillStyle = '#5d6b82'; ctx.textAlign = 'center';
        const lab = (a,b,t) => ctx.fillText(t, padL + (S[a].t+S[b].t)/2/T*w, padT+10);
        lab(seg.acc[0], seg.acc[1], '가속'); lab(seg.const[0], seg.const[1], '등속'); lab(seg.dec[0], seg.dec[1], '감속');
      }
      if (show.ar) trace('ar', '#5d6b82', am*1.1);
      if (show.x) trace('x', '#9b8cff', hm*1.1);
      if (show.y) trace('y', '#63d39a', hm*1.1);
      if (show.j) trace('j', '#ff7d6e', jm*1.1); if (show.v) trace('v', '#5cc8ff', vm*1.1); if (show.a) trace('a', '#f2b33d', am*1.1);
      ctx.fillStyle = '#8d9ab0'; ctx.textAlign = 'right';
      ctx.fillText([show.a||show.ar ? `±${am.toFixed(1)} m/s²` : '', show.v ? `±${vm.toFixed(2)} m/s` : '', show.j ? `±${jm.toFixed(1)} m/s³` : '', (show.x||show.y) ? `수평 ±${hm.toFixed(2)}` : ''].filter(Boolean).join('  '), W-padR, H-4);
      ctx.textAlign = 'left'; ctx.fillText(`${label(cur)}  0 – ${T.toFixed(0)} s`, padL, H-4);
    } else empty(`${label(cur)} 데이터 없음`);
    if (R.state === 'rec' && recKey === kid(cur)) { updateStats(); raf = requestAnimationFrame(draw); }
  }

  // ---- UI ----
  function buildTrials() {
    const box = $('trials'); box.innerHTML = '';
    for (let n = 1; n <= nTrials; n++) {
      const b = document.createElement('button'); b.className = 'chip'; b.dataset.n = n;
      b.innerHTML = `<span class="dot"></span>${n}회`;
      b.onclick = () => { cur = {dir:cur.dir, n}; refreshUI(); };
      box.appendChild(b);
    }
    const sel = document.createElement('select'); sel.title = '회차 수';
    for (let n = 1; n <= 5; n++) { const o = document.createElement('option'); o.value = n; o.textContent = n+'회'; if (n === nTrials) o.selected = true; sel.appendChild(o); }
    sel.onchange = () => { nTrials = +sel.value; if (cur.n > nTrials) cur.n = nTrials; save(); buildTrials(); refreshUI(); };
    box.appendChild(sel);
  }
  function refreshUI() {
    const key = kid(cur), R = R_(key);
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.dir === cur.dir));
    document.querySelectorAll('.chip').forEach(b => {
      const k = cur.dir + b.dataset.n, r = runs[k];
      b.classList.toggle('on', +b.dataset.n === cur.n);
      b.querySelector('.dot').className = 'dot' + (recKey === k ? ' rec' : r && r.S.length ? ' has' : '');
    });
    $('fs').textContent = R.fsEst ? R.fsEst.toFixed(0) + ' Hz' : '— Hz';
    const go = $('go'); go.classList.remove('stop');
    if (recKey) {
      go.disabled = recKey !== key;
      go.textContent = recKey === key ? '정지' : `${label({dir:recKey.replace(/\d+$/,''), n:+recKey.match(/\d+$/)[0]})} 기록 중`;
      if (recKey === key) go.classList.add('stop');
    } else { go.disabled = false; go.textContent = R.S.length ? `${label(cur)} 다시 측정` : `${label(cur)} 시작`; }
    $('csv').disabled = !R.S.length || recKey === key;
    $('reset').disabled = !R.S.length || !!recKey;
    $('load').disabled = !!recKey;
    updateStats(); updateSummary(); draw();
  }
  function setView(v) {
    view = v;
    document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
    $('lg-time').style.display = v === 'time' ? '' : 'none';
    $('lg-fft').style.display = v === 'fft' ? '' : 'none';
    draw();
  }

  async function start() {
    const key = kid(cur);
    if (recKey === key) return finish();
    if (recKey) return;
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        const r = await DeviceMotionEvent.requestPermission();
        if (r !== 'granted') { msg('모션 센서 권한이 거부되었습니다.', 'err'); return; }
      }
      if (!('DeviceMotionEvent' in window)) { msg('이 브라우저는 모션 센서를 지원하지 않습니다.', 'err'); return; }
      if (!isSecureContext) { msg('HTTPS에서만 센서를 사용할 수 있습니다.', 'err'); return; }
      try { wake = await navigator.wakeLock?.request('screen'); } catch(_) {}
      runs[key] = newRun(); runs[key].state = 'calib';
      recKey = key; calibBuf = []; setView('time');
      await startSensor();
      refreshUI(); msg(`[${label(cur)}] 영점 잡는 중… 2초간 움직이지 마세요.`);
      msg(`[${label(cur)}] 영점 잡는 중… (${srcName}) 2초간 움직이지 마세요.`);
      setTimeout(() => { if (runs[recKey]?.state === 'calib' && calibBuf.length === 0) msg('센서 데이터가 들어오지 않습니다. Chrome에서 열었는지 확인하세요.', 'err'); }, 1500);
    } catch (e) { msg('시작 실패: ' + e.message, 'err'); }
  }
  function reset() { if (recKey) return; runs[kid(cur)] = newRun(); save(); refreshUI(); msg(`[${label(cur)}] 초기화됨.`); }

  function exportCsv() {
    const S = R_(kid(cur)).S; if (!S.length) return;
    const rows = ['t_s,a_raw_mps2,a_filt_mps2,v_mps,jerk_mps3,s_m,ax_raw_mps2,ay_raw_mps2,ax_filt_mps2,ay_filt_mps2,jx_mps3,jy_mps3'];
    for (const p of S) rows.push([p.t, p.ar, p.a, p.v, p.j, p.s, p.xr||0, p.yr||0, p.x||0, p.y||0, p.jx||0, p.jy||0].map(n => n.toFixed(4)).join(','));

      if (!q) { isoTbl += `<tr><td>${DIR[it.dir]} ${it.n}회</td><td colspan="8" style="color:#6b7383">산출 불가</td></tr>`; continue; }
      const g = (a,b) => `${a.toFixed(3)} / ${b.toFixed(3)}`;
      isoTbl += `<tr><td>${DIR[it.dir]} ${it.n}회</td><td>${g(q.z.max,q.z.a95)}</td><td>${g(q.x.max,q.x.a95)}</td><td>${g(q.y.max,q.y.a95)}</td><td>${q.aMax.toFixed(2)}</td><td>${q.dMax.toFixed(2)}</td><td>${q.jMax.toFixed(2)}</td><td>${q.vMax.toFixed(2)}</td><td>${q.cvDur.toFixed(1)} s${q.full?'*':''}</td></tr>`;
    }
    isoTbl += '</table><p class="note">VPPV = 영교차점 사이 peak-to-peak 진동값(m/s²), 등속 구간 기준. A95 = 전체 VPPV의 95 백분위. 최대 가속·감속은 1 Hz 2극 버터워스, 속도는 10 Hz 저역통과 신호 적분. * 는 등속 구간을 분리하지 못해 전 구간으로 대체.</p>';
    let rbTbl = '<table><tr><th>회차</th><th>개방 시점</th><th>가속 개시</th><th>롤백 구간</th><th>최대 변위</th><th>최대 속도</th><th>가속도 피크</th><th>방향</th><th>판정</th></tr>';
    for (const it of list) {
      const q = rollback(it.R);
      const nm = `${DIR[it.dir]} ${it.n}회`;
      if (!q) { rbTbl += `<tr><td>${nm}</td><td colspan="8" style="color:#6b7383">산출 불가</td></tr>`; continue; }
      if (q.short) { rbTbl += `<tr><td>${nm}</td><td colspan="8" style="color:#6b7383">출발 전 정지 구간 부족</td></tr>`; continue; }
      if (q.none) { rbTbl += `<tr><td>${nm}</td><td colspan="7" style="color:#6b7383">가속 개시 전 유의 거동 없음</td><td>양호</td></tr>`; continue; }
      rbTbl += `<tr><td>${nm}</td><td>${q.tBr.toFixed(2)} s</td><td>${q.tOn.toFixed(2)} s</td><td>${(q.T*1000).toFixed(0)} ms</td><td>${(q.xPk*1000).toFixed(1)} mm</td><td>${(q.vPk*1000).toFixed(1)} mm/s</td><td>${q.aPk.toFixed(3)} m/s²</td><td>${rbDir(q)}</td><td>${q.valid ? '유의' : `잡음 이내 (±${(q.xNoise*1000).toFixed(1)} mm)`}</td></tr>`;
    }
    rbTbl += '</table><p class="note">브레이크 개방 시점 = 정지 구간 잡음의 4σ를 처음 초과한 시점, 가속 개시 = 1 Hz 필터 가속도가 0.1 m/s²를 처음 초과한 시점. 두 시점 사이를 정지 구간 평균으로 바이어스 보정한 뒤 적분해 변위·속도를 산출. 부호 +는 상승 방향. 판정의 잡음 한계는 잔류 바이어스 항(0.5·SE·T²)과 백색잡음 적분 항(σ·√(T/fs)·T/√3)의 합으로 추정했으며, 이를 3배 이상 초과할 때만 유의로 표기.</p>';
    let body = '';
    for (const it of list) {
      const S = it.R.S, o = stats(S), p = S[S.length-1], seg = segments(S);
      let fftTbl = '<table><tr><th>축 · 구간</th><th>길이</th><th>fs</th><th>Δf</th><th>피크 1</th><th>피크 2</th><th>피크 3</th></tr>';
      for (const axk of ['ar','xr','yr']) for (const w of ['acc','const','dec']) {
        const sp = spectrum(it.R, w, axk); if (!sp) continue;
        if (axk !== 'ar' && sp.peaks.length === 0) continue;
        const pk = i => sp.peaks[i] ? `${sp.peaks[i].f.toFixed(2)} Hz / ${sp.peaks[i].a.toFixed(3)}` : '—';
        fftTbl += `<tr><td>${sp.axis} · ${sp.seg}${sp.fallback?'*':''}</td><td>${sp.dur.toFixed(1)} s</td><td>${sp.fs.toFixed(0)} Hz</td><td>${sp.df.toFixed(2)} Hz</td><td>${pk(0)}</td><td>${pk(1)}</td><td>${pk(2)}</td></tr>`;
      }
      fftTbl += '</table><p class="note">피크 = 주파수 / 진폭(m/s²), 원시 가속도 기준. * 표시는 구간 샘플 부족으로 전체 구간 대체.</p>';
      body += `<section><h3>${DIR[it.dir]} ${it.n}회</h3>${svgChart(S, seg)}
        <table><tr><th>항목</th><th>max</th><th>min</th></tr>
        <tr><td>가속도 (m/s²)</td><td>${f(o.aMx)}</td><td>${f(o.aMn)}</td></tr>
        <tr><td>속도 (m/s)</td><td>${f(o.vMx)}</td><td>${f(o.vMn)}</td></tr>
        <tr><td>저크 (m/s³)</td><td>${f(o.jMx)}</td><td>${f(o.jMn)}</td></tr>
        ${(() => { const hz = horizStats(S); return hz ? `<tr><td>수평 전후 (m/s²)</td><td>${f(hz.xMx)}</td><td>${f(hz.xMn)}</td></tr><tr><td>수평 좌우 (m/s²)</td><td>${f(hz.yMx)}</td><td>${f(hz.yMn)}</td></tr><tr><td>저크 전후 (m/s³)</td><td>${f(axStats(S,'jx').mx)}</td><td>${f(axStats(S,'jx').mn)}</td></tr><tr><td>저크 좌우 (m/s³)</td><td>${f(axStats(S,'jy').mx)}</td><td>${f(axStats(S,'jy').mn)}</td></tr>` : ''; })()}</table>
        ${(() => { const hz = horizStats(S); return hz ? `<p class="note">수평 진동 전후 p-p ${hz.xpp.toFixed(3)} · rms ${hz.xrms.toFixed(3)} / 좌우 p-p ${hz.ypp.toFixed(3)} · rms ${hz.yrms.toFixed(3)} m/s²</p>` : ''; })()}
        <p class="note">주행 시간 ${p.t.toFixed(1)} s · 이동 거리 ${f(p.s)} m · 샘플 ${S.length} @ ${it.R.fsEst.toFixed(0)} Hz · 드리프트 보정 ${it.R.src ? '(파일)' : it.R.bias==null ? '—' : (it.R.bias*1000).toFixed(1)+' mm/s²'}</p>
        ${fftTbl}</section>`;
    }
    const now = new Date();
    const html = `<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>승강기 주행 계측 리포트</title><style>
      body{font-family:system-ui,"Noto Sans KR",sans-serif;color:#1b2029;max-width:840px;margin:0 auto;padding:24px 18px 60px;line-height:1.55}
      h1{font-size:21px;margin:0 0 4px} h3{font-size:16px;margin:26px 0 8px;padding-bottom:4px;border-bottom:2px solid #1b2029}
      h2{font-size:15px;margin:22px 0 6px;color:#42506b}
      table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 4px;font-variant-numeric:tabular-nums}
      th,td{border:1px solid #d5dae3;padding:5px 7px;text-align:right} th{background:#f2f4f8;font-weight:600} td:first-child,th:first-child{text-align:left}
      .note{font-size:11.5px;color:#6b7383;margin:4px 0 0}
      .hdr{font-size:12.5px;color:#42506b;margin:0 0 14px}
      svg{border:1px solid #e3e7ee;border-radius:6px;background:#fff;margin:4px 0}
      .lg{font-size:11.5px;color:#6b7383;margin:2px 0 8px}
      .lg i{display:inline-block;width:13px;height:3px;vertical-align:middle;margin:0 4px 0 10px}
      button{position:fixed;right:16px;bottom:16px;padding:12px 18px;border:0;border-radius:10px;background:#1b2029;color:#fff;font-size:14px;font-family:inherit}
      @media print{button{display:none} section{break-inside:avoid}}
      </style></head><body>
      <h1>승강기 주행 계측 리포트</h1>
      <p class="hdr">현장 ${esc(meta.site)||'—'} · 호기/기종 ${esc(meta.unit)||'—'} · 사양 ${esc(meta.spec)||'—'}<br>
      ${meta.addr ? '주소 '+esc(meta.addr)+'<br>' : ''}
      ${geo ? `위치 ${geo.lat.toFixed(6)}, ${geo.lon.toFixed(6)} (±${geo.acc.toFixed(0)} m) · <a href="https://www.google.com/maps?q=${geo.lat},${geo.lon}">지도</a><br>` : ''}
      측정자 ${esc(meta.by)||'—'} · 작성 ${now.toLocaleString('ko-KR')}</p>
      <h2>1. 전 회차 측정값</h2>${sum}
      <h2>2. 방향별 평균</h2>${rep}
      <h2>3. ISO 18738 산출값 (참고)</h2>${isoTbl}
      <h2>4. 안티롤백 분석 (참고)</h2>${rbTbl}
      <h2>5. 회차별 상세</h2>
      <p class="lg"><i style="background:#d99a1a"></i>가속도<i style="background:#2b7fc4"></i>속도<i style="background:#d9534f"></i>저크</p>
      ${body}
      <p class="note" style="margin-top:22px">측정: 스마트폰 3축 가속도계, 정지 시 중력벡터에 투영한 연직 성분. 수평 2축은 보정 시 정한 수평면 직교 기저에 투영(전후 = 기기 세로축의 수평 성분, 좌우 = 그 직교축). 가속도·수평 ${$('fc').value} Hz / 저크 ${$('jfc').value} Hz 2단 저역통과. 속도·거리는 사다리꼴 적분 후 종료 시 v=0 조건으로 선형 드리프트 보정. FFT는 필터 전 원시 가속도에 Hann 윈도우 적용.
ISO 18738 항목은 규격의 산출 절차(영교차점 VPPV, 1 Hz 버터워스 구간 판정, 10 Hz 적분 속도)를 따르되 주파수 가중은 적용하지 않았고, 스마트폰 센서로 측정했으므로 규격의 계측기 요구사항은 충족하지 않습니다. 참고값입니다.</p>
      <button onclick="print()">인쇄 / PDF 저장</button></body></html>`;
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `ride_report_${(meta.unit||'unit').replace(/\s+/g,'')}_${now.toISOString().slice(0,10)}.html`;
    a.click(); setTimeout(() => URL.revokeObjectURL(url), 3000);
    msg(`리포트 생성 (${list.length}건). 다운로드한 파일을 열고 인쇄 → PDF로 저장하세요.`, 'ok');
  }
  $('report').onclick = buildReport;


  // ================= 음성 명령 =================
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, micOn = false;
  const NUM = { '일':1, '하나':1, '첫':1, '이':2, '둘':2, '두':2, '삼':3, '셋':3, '세':3, '사':4, '넷':4, '네':4, '오':5, '다섯':5 };

  function voiceCmd(raw) {
    const t = raw.replace(/\s+/g, '');
    let done = null;
    // 방향
    if (/상승|올라|업/.test(t)) { cur = { dir:'up', n:cur.n }; done = '상승 탭'; }
    if (/하강|내려|다운/.test(t)) { cur = { dir:'down', n:cur.n }; done = '하강 탭'; }
    // 회차
    const m = t.match(/([1-5일이삼사오하나둘두셋세넷네다섯첫])\s*(회|번)/);
    if (m) {
      const n = /[1-5]/.test(m[1]) ? +m[1] : NUM[m[1]];
      if (n && n <= nTrials) { cur = { dir:cur.dir, n }; done = (done ? done + ' · ' : '') + n + '회'; }
    }
    // 동작
    if (/정지|멈춰|멈춤|스톱|그만|종료/.test(t)) { if (recKey) { finish(false); return '정지'; } }
    if (/시작|출발|기록|측정/.test(t)) { if (!recKey) { refreshUI(); start(); return (done ? done + ' · ' : '') + '시작'; } }
    if (/초기화|리셋|지워/.test(t)) { reset(); return '초기화'; }
    if (/리포트|보고서/.test(t)) { buildReport(); return '리포트'; }
    if (/저장|씨에스브이|시에스브이/.test(t)) { exportCsv(); return 'CSV 저장'; }
    if (/스펙트럼|주파수/.test(t)) { setView('fft'); return '스펙트럼'; }
    if (/시간|파형|그래프/.test(t)) { setView('time'); return '시간 그래프'; }
    if (/수직/.test(t)) { $('axis').value = 'v'; $('axis').onchange(); return '수직 축'; }
    if (/전후|앞뒤/.test(t)) { $('axis').value = 'x'; $('axis').onchange(); return '전후 축'; }
    if (/좌우|옆/.test(t)) { $('axis').value = 'y'; $('axis').onchange(); return '좌우 축'; }
    if (done) { refreshUI(); return done; }
    return null;
  }

  function micToggle() {
    if (!SR) { msg('이 브라우저는 음성 인식을 지원하지 않습니다 (Chrome 권장).', 'err'); return; }
    if (micOn) { micOn = false; try { rec.stop(); } catch(_) {} rec = null; setMicUI(); msg('음성 명령을 껐습니다.'); return; }
    rec = new SR();
    rec.lang = 'ko-KR'; rec.continuous = true; rec.interimResults = false; rec.maxAlternatives = 3;
    rec.onresult = e => {
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (!e.results[i].isFinal) continue;
        let hit = null, said = '';
        for (let k = 0; k < e.results[i].length; k++) {
          said = e.results[i][k].transcript;
          hit = voiceCmd(said);
          if (hit) break;
        }
        if (hit) { msg(`🎤 ${hit}`, 'ok'); if (navigator.vibrate) navigator.vibrate(40); }
        else msg(`🎤 "${said}" — 인식되지 않는 명령`);
      }
    };
    rec.onerror = ev => {
      if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') {
        micOn = false; setMicUI(); msg('마이크 권한이 거부되었습니다.', 'err');
      } else if (ev.error === 'network') {
        msg('음성 인식 서버에 연결하지 못했습니다 (승강로 안에서는 전파가 약할 수 있습니다).', 'err');
      }
    };
    rec.onend = () => { if (micOn) { try { rec.start(); } catch(_) {} } };
    try { rec.start(); micOn = true; setMicUI(); msg('음성 명령 켜짐 — "상승 일회 시작", "정지", "리포트" 처럼 말하세요.', 'ok'); }
    catch (e) { micOn = false; setMicUI(); msg('음성 인식 시작 실패: ' + e.message, 'err'); }
  }
  function setMicUI() {
    $('mic').classList.toggle('on', micOn);
    $('mic').textContent = micOn ? '🎤 음성 명령 켜짐 (탭하면 끔)' : '🎤 음성 명령 꺼짐';
  }
  $('mic').onclick = micToggle;

  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { cur = {dir:b.dataset.dir, n:cur.n}; refreshUI(); });
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setView(b.dataset.view));
  document.querySelectorAll('.lg').forEach(b => b.onclick = () => { const k = b.dataset.tr; show[k] = !show[k]; b.classList.toggle('on', show[k]); draw(); });
  $('fseg').onchange = draw; $('fax').onchange = draw;
  $('axis').onchange = () => {
    const ax = $('axis').value;
    show.a = ax === 'v'; show.v = ax === 'v'; show.j = ax === 'v';
    show.x = ax === 'x'; show.y = ax === 'y';
    document.querySelectorAll('.lg').forEach(b => b.classList.toggle('on', !!show[b.dataset.tr]));
    if (ax !== 'v') $('fax').value = ax === 'x' ? 'xr' : 'yr'; else $('fax').value = 'ar';
    refreshUI();
  };
  $('load').onclick = () => $('file').click();
  $('file').onchange = e => { if (e.target.files[0]) importCsv(e.target.files[0]); e.target.value = ''; };
  $('go').onclick = start; $('reset').onclick = reset; $('csv').onclick = exportCsv;
  addEventListener('resize', draw);
  load(); loadMeta(); buildTrials(); refreshUI(); setMicUI(); msg(IDLE_MSG);
})();
</script>
</body>
</html>
